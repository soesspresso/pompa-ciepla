name: Keep Supabase Active

on:
  schedule:
    - cron: '17 8  * * 1,3,5'   # poniedziałek, środa, piątek o 8:17
    - cron: '43 19 * * 2,4,6'   # wtorek, czwartek, sobota o 19:43
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Simulate app activity
        run: |
          # Losowe opóźnienie 0-5 minut
          sleep $((RANDOM % 300))

          BASE="${{ secrets.SUPABASE_URL }}/rest/v1"
          KEY="${{ secrets.SUPABASE_KEY }}"
          AUTH="Authorization: Bearer $KEY"
          APIKEY="apikey: $KEY"

          # 1. Pobierz stawki (jak robi to aplikacja przy starcie)
          curl -sf -H "$APIKEY" -H "$AUTH" \
            "$BASE/stawki?select=rok,stawka_kwh&order=rok.desc" -o /dev/null

          sleep $((RANDOM % 30 + 5))

          # 2. Pobierz ostatni odczyt (dashboard)
          curl -sf -H "$APIKEY" -H "$AUTH" \
            "$BASE/odczyty?select=miesiac,rok,stan,starts&order=dzien.desc&limit=1" \
            | grep -o '"rok":[0-9]*' && echo ""

          sleep $((RANDOM % 20 + 3))

          # 3. Pobierz ostatnie 6 odczytów (wykres trendu)
          curl -sf -H "$APIKEY" -H "$AUTH" \
            "$BASE/odczyty?select=miesiac,rok,stan&order=dzien.desc&limit=6" -o /dev/null

          sleep $((RANDOM % 15 + 2))

          # 4. Pobierz wszystkie odczyty (historia/analityka)
          curl -sf -H "$APIKEY" -H "$AUTH" \
            "$BASE/odczyty?select=rok,miesiac,stan,starts,dzien&order=dzien.asc" -o /dev/null

          echo "✓ Aktywność zasymulowana"
