name: Keep Supabase Active

on:
  schedule:
    - cron: '17 8  * * 1,3,5'   # poniedziałek, środa, piątek o 8:17
    - cron: '43 19 * * 2,4,6'   # wtorek, czwartek, sobota o 19:43
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Update and restore stawka
        run: |
          sleep $((RANDOM % 300))

          BASE="${{ secrets.SUPABASE_URL }}/rest/v1"
          KEY="${{ secrets.SUPABASE_KEY }}"
          AUTH="Authorization: Bearer $KEY"
          APIKEY="apikey: $KEY"
          CONTENT="Content-Type: application/json"
          ROK=$(date +%Y)

          # 1. Pobierz aktualną stawkę dla bieżącego roku
          CURRENT=$(curl -sf \
            -H "$APIKEY" -H "$AUTH" \
            "$BASE/stawki?select=stawka_kwh&rok=eq.$ROK" \
            | grep -o '[0-9]*\.[0-9]*' | head -1)

          echo "Aktualna stawka: $CURRENT PLN/kWh"

          if [ -z "$CURRENT" ]; then
            echo "Brak stawki dla roku $ROK, pomijam UPDATE"
            exit 0
          fi

          # 2. Dodaj 1 grosz
          MODIFIED=$(echo "$CURRENT + 0.01" | bc)
          echo "Zmieniam na: $MODIFIED"

          curl -sf -X PATCH \
            -H "$APIKEY" -H "$AUTH" -H "$CONTENT" \
            "$BASE/stawki?rok=eq.$ROK" \
            -d "{\"stawka_kwh\": $MODIFIED}" -o /dev/null

          sleep $((RANDOM % 60 + 30))

          # 3. Przywróć oryginalną stawkę
          echo "Przywracam: $CURRENT"

          curl -sf -X PATCH \
            -H "$APIKEY" -H "$AUTH" -H "$CONTENT" \
            "$BASE/stawki?rok=eq.$ROK" \
            -d "{\"stawka_kwh\": $CURRENT}" -o /dev/null

          echo "✓ Stawka przywrócona do $CURRENT PLN/kWh"
