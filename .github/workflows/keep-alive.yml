name: Keep Supabase Active

on:
  schedule:
    - cron: '17 8  * * 1,3,5'
    - cron: '43 19 * * 2,4,6'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Update and restore stawka
        run: |
          sleep $((RANDOM % 300))

          BASE="${{ secrets.SUPABASE_URL }}/rest/v1"
          KEY="${{ secrets.SUPABASE_KEY }}"
          AUTH="Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_KEY }}"
          APIKEY="apikey: ${{ secrets.SUPABASE_SERVICE_KEY }}"
          CONTENT="Content-Type: application/json"
          PREFER="Prefer: return=minimal"
          ROK=$(date +%Y)

          # 1. Pobierz aktualną stawkę
          RESPONSE=$(curl -s \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
            "$BASE/stawki?select=stawka_kwh&rok=eq.$ROK")
          echo "Response: $RESPONSE"

          CURRENT=$(echo "$RESPONSE" | grep -o '[0-9]*\.[0-9]*' | head -1)
          echo "Aktualna stawka: $CURRENT PLN/kWh"

          if [ -z "$CURRENT" ]; then
            echo "Brak stawki dla roku $ROK"
            exit 0
          fi

          # 2. Dodaj 1 grosz — wymuszamy format 0.XX
          MODIFIED=$(printf "%.4f" $(echo "$CURRENT + 0.01" | bc))
          echo "Zmieniam na: $MODIFIED"

          PATCH1=$(curl -s -X PATCH \
            -H "$APIKEY" -H "$AUTH" -H "$CONTENT" -H "$PREFER" \
            "$BASE/stawki?rok=eq.$ROK" \
            -d "{\"stawka_kwh\": $MODIFIED}")
          echo "PATCH1 response: $PATCH1"

          sleep $((RANDOM % 60 + 30))

          # 3. Przywróć oryginalną stawkę
          ORIGINAL=$(printf "%.4f" $CURRENT)
          echo "Przywracam: $ORIGINAL"

          PATCH2=$(curl -s -X PATCH \
            -H "$APIKEY" -H "$AUTH" -H "$CONTENT" -H "$PREFER" \
            "$BASE/stawki?rok=eq.$ROK" \
            -d "{\"stawka_kwh\": $ORIGINAL}")
          echo "PATCH2 response: $PATCH2"

          echo "✓ Gotowe"
